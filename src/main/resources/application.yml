server:
  port: ${SERVER_PORT}

spring:
  application:
    name: feed-service
  cloud:
    compatibility-verifier:
      enabled: false
  profiles:
    include:
      - security
      - openapi
      - database
      - openfeign
      - firebase
      - kafka

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      access: read_only
